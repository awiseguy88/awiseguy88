name: Refresh public profile counts
on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read public GitHub counts
        shell: python
        run: |
          import json
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          def count(kind, query):
              params = urlencode({"q": query, "per_page": 1})
              request = Request(f"https://api.github.com/search/{kind}?{params}",
                                headers={"User-Agent": "awiseguy88-profile"})
              with urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if result["incomplete_results"]:
                  raise RuntimeError("GitHub returned partial search results")
              return result["total_count"]

          commits = count("commits", "author:awiseguy88")
          repos = count("repositories", "user:awiseguy88 fork:false is:public")
          metrics = (f"[{commits:,} indexed public commits](https://github.com/search?q=author%3Aawiseguy88&type=commits) · "
                     f"[{repos:,} owned public repositories excluding forks](https://github.com/search?q=user%3Aawiseguy88+fork%3Afalse+is%3Apublic&type=repositories)")
          path = Path("README.md")
          start = "<!-- METRICS:START -->"
          end = "<!-- METRICS:END -->"
          before, block = path.read_text(encoding="utf-8").split(start)
          _, after = block.split(end)
          path.write_text(f"{before}{start}\n{metrics}\n{end}{after}", encoding="utf-8")
      - name: Commit changed counts
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh public profile counts"
          git push
